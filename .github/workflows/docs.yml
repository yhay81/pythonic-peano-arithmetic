name: Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    environment:
      name: production
      url: https://peano.yhay81.com/
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: true
          python-version: "3.14"
      - name: Sync dependencies
        run: uv sync --locked
      - name: Build documentation
        run: make docs
      - name: Install browser for accessibility checks
        run: npx --yes browser-driver-manager@2.0.1 install chrome
      - name: Audit documentation accessibility
        run: make docs-a11y

      - name: Deploy to Cloudflare Workers
        if: >-
          env.CLOUDFLARE_API_TOKEN != '' &&
          env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.114.0"

      - name: Report missing Cloudflare secrets
        if: >-
          env.CLOUDFLARE_API_TOKEN == '' ||
          env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::warning title=Cloudflare deployment skipped::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable deployment."
          {
            echo "## Cloudflare deployment skipped"
            echo
            echo "The documentation build passed, but the required repository secrets are not configured."
          } >> "$GITHUB_STEP_SUMMARY"
