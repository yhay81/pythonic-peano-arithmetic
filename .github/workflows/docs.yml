name: Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          prune-cache: true
          python-version: "3.14"
      - name: Sync dependencies
        run: uv sync --locked
      - name: Build documentation
        run: make docs
      - name: Share the verified documentation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-site
          path: site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  accessibility:
    needs: build
    uses: ./.github/workflows/audit-docs.yml

  deploy:
    name: Deploy the audited documentation
    needs: accessibility
    environment:
      name: production
      url: https://peano.yhay81.com/
    runs-on: ubuntu-latest
    timeout-minutes: 1
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the verified documentation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-site
          path: site

      - name: Deploy to Cloudflare Workers
        if: >-
          env.CLOUDFLARE_API_TOKEN != '' &&
          env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.114.0"

      - name: Report missing Cloudflare secrets
        if: >-
          env.CLOUDFLARE_API_TOKEN == '' ||
          env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::warning title=Cloudflare deployment skipped::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable deployment."
          {
            echo "## Cloudflare deployment skipped"
            echo
            echo "The documentation build passed, but the required repository secrets are not configured."
          } >> "$GITHUB_STEP_SUMMARY"
