name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    timeout-minutes: 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          prune-cache: true
          python-version: "3.14"
      - name: Sync dependencies
        run: uv sync --locked
      - name: Run quality checks
        run: uv run --locked prek run --all-files
      - name: Execute notebook
        run: >
          uv run --locked jupyter nbconvert --to notebook --execute
          --ExecutePreprocessor.timeout=60 --stdout examples.ipynb > /dev/null
      - name: Build distributions
        run: make build
      - name: Share the verified documentation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-site
          path: site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  accessibility:
    needs: quality
    uses: ./.github/workflows/audit-docs.yml

  test:
    timeout-minutes: 1
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          prune-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: uv run --locked python -m unittest
