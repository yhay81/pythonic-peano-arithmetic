[project]
name = "pythonic-peano-arithmetic"
version = "0.3.0"
description = "Peano公理から有理数を構成し、代数的実根を有理区間で追う学習用ライブラリ"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Yusuke Hayashi", email = "yusuke8h@gmail.com" },
]
keywords = ["arithmetic", "education", "mathematics", "peano"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/yhay81/pythonic-peano-arithmetic"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "notebook>=7.6.1",
    "pre-commit>=4.6.1",
    "ruff>=0.16.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.11.28,<0.12"

[tool.uv.build-backend]
module-name = "peano"
module-root = ""

[tool.mypy]
strict = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
