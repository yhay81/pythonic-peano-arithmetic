[project]
name = "pythonic-peano-arithmetic"
version = "0.4.0"
description = "Build arithmetic from Peano axioms and trace algebraic real roots"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Yusuke Hayashi", email = "yusuke8h@gmail.com" },
]
keywords = ["arithmetic", "education", "mathematics", "peano"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Documentation = "https://peano.yhay81.com/en/"
Homepage = "https://peano.yhay81.com/en/"
Issues = "https://github.com/yhay81/pythonic-peano-arithmetic/issues"
Repository = "https://github.com/yhay81/pythonic-peano-arithmetic"

[dependency-groups]
dev = [
    "notebook>=7.6.1",
    "prek>=0.4.11",
    "ruff>=0.16.0",
    "typing-extensions>=4.16.0",
    "ty>=0.0.63",
    "zensical>=0.0.51",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.11.28,<0.12"

[tool.uv.build-backend]
module-name = "peano"
module-root = ""

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
extend-select = ["ANN", "PYI", "T10"]
preview = true
